name: Build and Release Mac Client

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 16
          check-latest: true
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Cache node_modules
        uses: actions/cache@v5
        id: cacheNodeModules
        with:
          path: ${{ github.workspace }}/node_modules
          key: macos-node_modules-cache-v1-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            macos-node_modules-cache-v1-

      - name: Cache Electron
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/electron
          key: macos-electron-cache-v1-${{ hashFiles('yarn.lock') }}

      - name: Cache Electron-Builder
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/electron-builder
          key: macos-electron-builder-cache-v1-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        run: yarn install --check-files --frozen-lockfile

      - name: Lint
        run: yarn run lint

      - name: Build Mac Client
        run: yarn run release:mac

      - name: Upload Mac Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: marktext-mac
          path: |
            build/marktext-*.dmg
            build/marktext-*.zip
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/marktext-*.dmg
            build/marktext-*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
